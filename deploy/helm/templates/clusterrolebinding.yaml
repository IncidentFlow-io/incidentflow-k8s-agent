{{- range $namespace := .Values.namespaceAllowlist }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "incidentflow-k8s-agent.fullname" $ }}
  namespace: {{ $namespace }}
  labels:
    {{- include "incidentflow-k8s-agent.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "incidentflow-k8s-agent.fullname" $ }}
subjects:
  - kind: ServiceAccount
    name: {{ include "incidentflow-k8s-agent.fullname" $ }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
