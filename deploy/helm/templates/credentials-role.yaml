apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "incidentflow-k8s-agent.fullname" . }}-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "incidentflow-k8s-agent.labels" . | nindent 4 }}
rules:
  # The agent can read and update only its own permanent credentials Secret.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ include "incidentflow-k8s-agent.secretName" . | quote }}]
    verbs: ["get", "update", "patch"]
