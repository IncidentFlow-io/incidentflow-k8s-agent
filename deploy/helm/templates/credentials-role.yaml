apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "incidentflow-k8s-agent.fullname" . }}-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "incidentflow-k8s-agent.labels" . | nindent 4 }}
rules:
  # Credentials are provisioned and rotated by an external Secret manager. The
  # agent never receives write, patch, create, delete or list permissions.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ include "incidentflow-k8s-agent.secretName" . | quote }}]
    verbs: ["get"]
