apiVersion: v1
kind: Secret
metadata:
  name: {{ include "incidentflow-k8s-agent.secretName" . }}
  labels:
    {{- include "incidentflow-k8s-agent.labels" . | nindent 4 }}
type: Opaque
{{- if and (include "incidentflow-k8s-agent.registrationToken" .) (not (or .Values.registrationTokenSecretName .Values.agent.registrationTokenSecretName)) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "incidentflow-k8s-agent.bootstrapSecretName" . }}
  labels:
    {{- include "incidentflow-k8s-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  registration-token: {{ include "incidentflow-k8s-agent.registrationToken" . | quote }}
{{- end }}
