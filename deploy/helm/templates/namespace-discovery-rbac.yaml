{{- if .Values.namespaceDiscovery.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "incidentflow-k8s-agent.fullname" . }}-namespace-discovery
  labels:
    {{- include "incidentflow-k8s-agent.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "incidentflow-k8s-agent.fullname" . }}-namespace-discovery
  labels:
    {{- include "incidentflow-k8s-agent.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "incidentflow-k8s-agent.fullname" . }}-namespace-discovery
subjects:
  - kind: ServiceAccount
    name: {{ include "incidentflow-k8s-agent.fullname" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
