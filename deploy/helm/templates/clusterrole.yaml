{{- if eq (len .Values.namespaceAllowlist) 0 }}
{{- fail "namespaceAllowlist must contain at least one namespace" }}
{{- end }}
{{- range $namespace := .Values.namespaceAllowlist }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "incidentflow-k8s-agent.fullname" $ }}
  namespace: {{ $namespace }}
  labels:
    {{- include "incidentflow-k8s-agent.labels" $ | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
{{- end }}
